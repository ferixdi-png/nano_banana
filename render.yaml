services:
  - type: web
    name: nano-banana-flow-bot
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    maxShutdownDelaySeconds: 300
    disk:
      name: flow-session
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_ID
        sync: false
      - key: ALLOWED_CHAT_ID
        sync: false
      - key: KIE_API_KEY
        sync: false
      - key: KIE_API_BASE_URL
        value: https://api.kie.ai
