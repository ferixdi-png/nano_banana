services:
  - type: web
    name: nano-banana-flow-bot
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    maxShutdownDelaySeconds: 300
    disk:
      name: flow-session
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_ID
        sync: false
      - key: ALLOWED_CHAT_ID
        sync: false
      - key: FLOW_PROJECT_URL
        sync: false
      - key: FLOW_STORAGE_STATE_B64
        sync: false
      - key: FLOW_GOOGLE_EMAIL
        sync: false
      - key: FLOW_GOOGLE_PASSWORD
        sync: false
      - key: FLOW_GOOGLE_TOTP_SECRET
        sync: false
