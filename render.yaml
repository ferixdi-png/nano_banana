services:
  - type: worker
    name: nano_banana
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_CHAT_ID
        sync: false
      - key: ALLOWED_USER_ID
        sync: false
      - key: KIE_API_KEY
        sync: false
